name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: ./mvnw verify
        run: ./mvnw -B verify

  docker:
    name: docker compose up
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Levantar la app
        run: docker compose up --build -d
      - name: Esperar a que responda
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1
      - name: Revisar datos semilla
        run: test "$(curl -s http://localhost:8080/api/listings | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')" = "6"
      - name: Apagar
        if: always()
        run: docker compose down -v
