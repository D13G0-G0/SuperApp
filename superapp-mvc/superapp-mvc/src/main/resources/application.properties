server.port=8080

# H2 en memoria: no necesitas instalar nada. Los datos se pierden al apagar la app.
spring.datasource.url=jdbc:h2:mem:superapp_db
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea la tabla a partir de la entity (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la BD: http://localhost:8080/h2-console
spring.h2.console.enabled=true
