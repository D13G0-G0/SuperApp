# Levanta todo con un solo comando:  docker compose up --build
# App: http://localhost:8080
# Las credenciales son SOLO de desarrollo (no son claves reales).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superapp
      POSTGRES_USER: superapp
      POSTGRES_PASSWORD: superapp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superapp -d superapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Hora de Colombia: las fechas (pedidos, historial, billetera) se guardan y se muestran en esta zona.
      TZ: America/Bogota
      DB_URL: jdbc:postgresql://db:5432/superapp
      DB_USER: superapp
      DB_PASSWORD: superapp
      # Secreto SOLO de desarrollo. En un servidor real se cambia por uno largo y aleatorio.
      JWT_SECRET: desarrollo-superapp-cambiar-en-produccion-0123456789
    ports:
      - "8080:8080"

volumes:
  db-data:
