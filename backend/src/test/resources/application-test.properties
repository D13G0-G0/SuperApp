# Pruebas automáticas: H2 en memoria en modo PostgreSQL, con las MISMAS migraciones de Flyway
# y ddl-auto=validate, así las pruebas no necesitan Docker.
spring.datasource.url=jdbc:h2:mem:superapp-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Secreto SOLO para las pruebas automáticas (no es una clave real).
superapp.jwt.secret=solo-pruebas-superapp-no-es-un-secreto-real-0123456789
