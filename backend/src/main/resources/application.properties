spring.application.name=superapp-api
server.port=8080

# PostgreSQL. En Docker los valores llegan por variables de entorno (docker-compose.yml).
# Los valores por defecto son solo de desarrollo local, nunca claves reales.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/superapp}
spring.datasource.username=${DB_USER:superapp}
spring.datasource.password=${DB_PASSWORD:superapp}

# El esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo verifica que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
